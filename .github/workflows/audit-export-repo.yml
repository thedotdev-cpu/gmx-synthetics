name: Audit repository export

on:
  push:
    branches:
      - audit/unconditional-main-a85ea349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package repository without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > AUDIT_BRANCH_COMMIT.txt
          git rev-parse HEAD:contracts > AUDITED_CONTRACTS_TREE.txt
          tar --exclude=.git -czf gmx-synthetics-audit-repo.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: gmx-synthetics-audit-repo-${{ github.sha }}
          path: |
            gmx-synthetics-audit-repo.tar.gz
            AUDIT_BRANCH_COMMIT.txt
            AUDITED_CONTRACTS_TREE.txt
          if-no-files-found: error
          retention-days: 1
