name: Audit source sweep

on:
  push:
    branches:
      - audit/unconditional-main-a85ea349
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: yarn
      - name: Install dependencies
        run: yarn --ignore-scripts --frozen-lockfile
      - name: Sweep every Solidity source file
        shell: bash
        run: |
          set -o pipefail
          npx hardhat test --no-compile test/audit/SourceSweep.ts 2>&1 | tee audit-source-sweep.log
      - name: Package exact source tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > AUDIT_BRANCH_COMMIT.txt
          git rev-parse HEAD^:contracts > AUDITED_CONTRACTS_TREE.txt
          find contracts -type f -print0 | sort -z | xargs -0 sha256sum > CONTRACTS_SHA256SUMS.txt
          tar -czf gmx-synthetics-contracts-a85ea349.tar.gz contracts
      - name: Upload full sweep and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-source-sweep-${{ github.sha }}
          path: |
            audit-source-sweep.log
            gmx-synthetics-contracts-a85ea349.tar.gz
            AUDIT_BRANCH_COMMIT.txt
            AUDITED_CONTRACTS_TREE.txt
            CONTRACTS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
